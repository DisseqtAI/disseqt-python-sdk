name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml dispatches CI on its release-pr/* branch: a PR opened with
  # GITHUB_TOKEN does not fire pull_request workflows, so without this the
  # required lint / test / trivy checks would never report on a release PR.
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Black (format check)
        run: uv run black --check .

      - name: Mypy (type check)
        # Scoped to disseqt_sdk only; disseqt_agentic_sdk has pre-existing
        # strict-mode errors tracked separately.
        run: uv run mypy src/disseqt_sdk/

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Unit + agentic tests with coverage
        # Integration tests require a live API and are excluded from CI.
        run: |
          uv run pytest tests/unit tests/agentic \
            --cov=src --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # The ADK instrumentor hooks private functions that google-adk has moved
  # between releases (the tool call sites live in a different module in
  # 1.32, 2.9 and 2.14). The lock pins one version; this runs the ADK
  # tests against the oldest release the SDK supports and the newest one
  # published, so a layout change fails here instead of silently
  # dropping spans for customers.
  adk-compat:
    name: adk-compat (${{ matrix.adk }})
    runs-on: ubuntu-latest
    # Read-only: the job checks the code out and runs tests, nothing else.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - adk: "oldest supported"
            requirement: "google-adk==1.32.0"
            python-version: "3.10"
          - adk: "latest"
            requirement: "google-adk"
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: ADK instrumentation tests against ${{ matrix.requirement }}
        run: |
          uv run --isolated --python "${{ matrix.python-version }}" \
            --with "${{ matrix.requirement }}" --upgrade-package google-adk \
            python -c "from importlib.metadata import version; print('google-adk', version('google-adk'))"
          uv run --isolated --python "${{ matrix.python-version }}" \
            --with "${{ matrix.requirement }}" --upgrade-package google-adk \
            pytest tests/agentic/instrumentation/test_adk.py \
              tests/agentic/instrumentation/test_adk_e2e.py -v

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Upload SARIF
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (CRITICAL fails the build)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Trivy SARIF report (CRITICAL + HIGH, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy.sarif'
          category: 'python-sdk-fs'
