name: Release

# Step 1 of 2: open a release PR.
#
# Bumps the version, stamps the CHANGELOG, gates on the test suite, then
# pushes a release-pr/vX.Y.Z branch and opens a "Release vX.Y.Z" PR into
# main. main is protected by the security-enforcement ruleset (PR + review
# + lint/test/trivy required, no bypass), so the workflow never pushes to
# main itself.
#
# Step 2 (tag-release.yml) runs when that PR is merged: it tags the merge
# commit, creates the GitHub release and dispatches publish.yml (trusted
# publishing to PyPI). After PyPI, the backend advertises the new version
# automatically via its registry polling (SDK_VERSION_POLL_INTERVAL in
# production-monitoring): no Vault bump, no restart.
#
# Branch prefix is release-pr/, NOT release/: release/* is covered by the
# same ruleset and the push would be rejected.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        options: [patch, minor, major]
        default: minor
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Bump version and stamp CHANGELOG
        id: prep
        run: |
          VERSION=$(python3 .github/scripts/prepare_release.py "${{ inputs.bump }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=release-pr/v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing v$VERSION"

      - name: Refuse if a release PR for this version already exists
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prep.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::Branch $BRANCH already exists. Merge or close its PR" \
              "(and delete the branch) before running Release again."
            exit 1
          fi

      - name: Lock and run the test suite
        run: |
          uv lock
          uv run pytest tests/unit/ tests/agentic/ -q

      - name: Commit and push release branch
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          BRANCH: ${{ steps.prep.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add pyproject.toml CHANGELOG.md uv.lock
          git commit -m "Release v$VERSION"
          git push origin "$BRANCH"

      - name: Mint release-bot App token
        # The org blocks GITHUB_TOKEN from creating PRs (createPullRequest
        # is disabled for Actions org-wide). disseqt-sdk-release-bot is a
        # GitHub App installed on this repo only (Contents + Pull requests:
        # read/write), minted here and used for the one step that needs it.
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.prep.outputs.version }}
          BRANCH: ${{ steps.prep.outputs.branch }}
        run: |
          {
            echo "Automated release PR opened by the **Release** workflow."
            echo
            echo "Merging it tags \`v$VERSION\` on the merge commit, creates the"
            echo "GitHub release and publishes to PyPI (\`tag-release.yml\`)."
            echo "Do not edit the version on this branch."
            echo
            echo "## Release notes"
            echo
            cat release_notes.md
          } > pr_body.md
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release v$VERSION" \
            --body-file pr_body.md

      - name: Run required checks on the release branch
        # A PR opened with GITHUB_TOKEN does not trigger pull_request
        # workflows; workflow_dispatch is the documented exception. The
        # dispatched run reports lint / test / trivy on the PR's head commit.
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prep.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"
