name: Tag release

# Step 2 of 2: runs when a release-pr/vX.Y.Z PR (opened by release.yml) is
# merged into main. Tags the merge commit vX.Y.Z, creates the GitHub
# release from the CHANGELOG section, then dispatches publish.yml at that
# tag. The explicit dispatch is required: a release created with
# GITHUB_TOKEN does not fire other workflows' `release:` triggers, but
# workflow_dispatch is the documented exception, so no PAT is needed.
#
# Manual run (workflow_dispatch) tags whatever version main currently
# declares, for recovery if the automatic run failed after the merge.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release-pr/v') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0

      - name: Read version and release notes
        id: meta
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ -n "$HEAD_REF" ] && [ "$HEAD_REF" != "release-pr/v$VERSION" ]; then
            echo "::error::Branch $HEAD_REF does not match pyproject version $VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists; nothing to release."
            exit 1
          fi
          python3 - "$VERSION" > release_notes.md <<'EOF'
          import re, sys
          version = sys.argv[1]
          log = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", log, re.M | re.S)
          print((m.group(1).strip() if m else "") or "Maintenance release.")
          EOF
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION at $(git rev-parse --short HEAD)"

      - name: Tag and push
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file release_notes.md

      - name: Dispatch PyPI publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: gh workflow run publish.yml --ref "v$VERSION"
