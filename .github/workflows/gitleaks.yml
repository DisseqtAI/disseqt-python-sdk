name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks (scan new commits only)
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            DEF="${{ github.event.repository.default_branch }}"
            git fetch origin "$DEF" --depth=1 || true
            RANGE="origin/$DEF..${{ github.sha }}"
          else
            RANGE="${BEFORE}..${{ github.sha }}"
          fi
          echo "Scanning range: $RANGE"
          gitleaks detect --source . --redact --no-banner --config .gitleaks.toml --log-opts="$RANGE"
